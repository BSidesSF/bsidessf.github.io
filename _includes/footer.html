<footer class="site-footer">
  <nav class="navbar">
	  <nav class="row">
	    <div id="nav">
		    <ul class="columns medium-8 right primary-nav">
          {% for item in site.data.footer %}
				  <li{% if item.href == page.url %} class="active"{% endif %}>
					  <a href="{{ site.baseurl }}{{ item.href }}">{{ item.title }}</a>
				  </li>
          {% endfor %}
        </ul>
      </div>
    </nav>
  </nav>
</footer>
